name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "custom-chromium-browser*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Khong tim thay file zip custom-chromium-browser*.zip"
            ls -la
            exit 1
          fi
          echo "Dang giai nen: $ZIP_FILE"
          mkdir -p project
          unzip -q -o "$ZIP_FILE" -d project
          SETTINGS=$(find project -maxdepth 3 -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Khong thay settings.gradle trong zip"
            find project -maxdepth 3
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Remove workflow bundled in zip
        run: |
          find project -type d -path "*/.github/workflows" -prune -exec rm -rf {} +
          find project -type d -name ".github" -empty -delete
          echo "Da xoa .github/workflows trong project"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Setup Environment Files
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Ensure debug.keystore exists for debug signing
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Ensure my-upload-key.jks exists for Release signing
          if [ ! -f my-upload-key.jks ]; then
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            else
              keytool -genkey -v -keystore my-upload-key.jks \
                -storepass "$STORE_PASSWORD" -alias upload -keypass "$KEY_PASSWORD" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Aura Browser Release,O=Aura,C=VN"
            fi
          fi

      - name: Bundle uBlock Origin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          META=$(curl -fsSL https://addons.mozilla.org/api/v5/addons/addon/ublock-origin/)
          XPI_URL=$(echo "$META" | jq -r '.current_version.file.url')
          UBLOCK_VERSION=$(echo "$META" | jq -r '.current_version.version')
          test -n "$XPI_URL" && test "$XPI_URL" != "null"
          curl -fsSL "$XPI_URL" -o /tmp/ublock.xpi
          test -s /tmp/ublock.xpi
          rm -rf app/src/main/assets/extensions/ublock
          mkdir -p app/src/main/assets/extensions/ublock
          unzip -q /tmp/ublock.xpi -d app/src/main/assets/extensions/ublock
          # Xoa chu ky (dung nhu extension built-in)
          rm -rf app/src/main/assets/extensions/ublock/META-INF
          test -f app/src/main/assets/extensions/ublock/manifest.json
          GECKO_ID=$(jq -r '.browser_specific_settings.gecko.id' app/src/main/assets/extensions/ublock/manifest.json)
          if [ "$GECKO_ID" != "uBlock0@raymondhill.net" ]; then
            echo "::error::Gecko ID khong khop: $GECKO_ID"
            exit 1
          fi
          echo "Da goi uBlock Origin phien ban $UBLOCK_VERSION (id=$GECKO_ID)"

      - name: Run Unit Tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Minified Release (Debug Signed) APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleReleaseDebugSigned --no-daemon --stacktrace

      - name: Upload Minified APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-minified
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/releaseDebugSigned/*.apk
          if-no-files-found: error
          retention-days: 5

      - name: Build Release APK (R8 Minified)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 5

      - name: Upload R8 Mapping Files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-r8-mapping
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/mapping/**
          if-no-files-found: ignore
          retention-days: 5
